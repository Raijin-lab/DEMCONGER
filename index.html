<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Absence</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 10px;
        }

        .page-a4 {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        td, th {
            border: 1px solid #000;
            padding: 8px 12px;
            vertical-align: middle;
        }

        .header-table td {
            border: 2px solid #000;
            text-align: center;
        }
        .logo-cell {
            width: 35%;
        }
        .logo {
            font-size: 42px;
            font-weight: bold;
            margin: 0;
        }
        .logo .a2 { color: #555; }
        .logo .cim { color: #d32f2f; }
        .title-doc {
            font-size: 22px;
            font-weight: bold;
        }

        .date-demande-container {
            text-align: right;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        .date-demande-container input {
            border: none;
            border-bottom: 1px dashed #000;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            width: 130px;
            text-align: center;
        }

        .form-table td {
            height: 45px;
            font-size: 15px;
        }
        .label-cell {
            background-color: #f9f9f9;
            font-weight: bold;
            width: 25%;
        }

        .checkbox-group {
            display: flex;
            justify-content: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            background: transparent;
        }
        .uppercase-input {
            text-transform: uppercase;
        }

        .sig-table th {
            background-color: #f9f9f9;
            text-align: left;
            font-size: 12px;
            vertical-align: top;
            height: 40px;
            width: 33.33%;
        }
        .sig-table td {
            height: 100px;
            text-align: center;
        }
        .text-signature {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 32px;
            color: #000044;
            transform: rotate(-5deg);
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn-print {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }

        @media print {
            body { background: none; padding: 0; }
            .page-a4 { box-shadow: none; padding: 0; max-width: 100%; width: 100%; margin: 0; }
            .btn-container { display: none; }
            .logo .a2 { color: #555 !important; -webkit-print-color-adjust: exact; }
            .logo .cim { color: #d32f2f !important; -webkit-print-color-adjust: exact; }
            .label-cell, .sig-table th { background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="page-a4">
    
    <table class="header-table">
        <tr>
            <td class="logo-cell">
                <div class="logo"><span class="a2">A2</span><span class="cim">CIM</span></div>
            </td>
            <td class="title-doc">DEMANDE D'AUTORISATION D'ABSENCE</td>
        </tr>
    </table>

    <div class="date-demande-container">
        Date de la demande : <input type="date" id="dateDemande">
    </div>

    <table class="form-table">
        <tr>
            <td class="label-cell">Type d'absence :</td>
            <td colspan="3">
                <div class="checkbox-group">
                    <label><input type="radio" name="type" value="conge_paye"> Congé Payé</label>
                    <label><input type="radio" name="type" value="conge_sans_solde"> Congé sans solde</label>
                    <label><input type="radio" name="type" value="recuperation"> Récupération</label>
                </div>
            </td>
        </tr>
        <tr>
            <td class="label-cell">NOM</td>
            <td colspan="3"><input type="text" id="nomInput" value="BADIS" class="uppercase-input" oninput="updateSignature()"></td>
        </tr>
        <tr>
            <td class="label-cell">PRENOM</td>
            <td colspan="3"><input type="text" id="prenomInput" value="ZOUHAIR" class="uppercase-input" oninput="updateSignature()"></td>
        </tr>
        <tr>
            <td class="label-cell">Date Départ</td>
            <td style="width: 25%;"><input type="date" id="dateDepart" onchange="calculerAbsence()"></td>
            <td class="label-cell" style="width: 25%;">Heure Départ</td>
            <td style="width: 25%;"><input type="time" id="heureDepart" onchange="calculerAbsence()"></td>
        </tr>
        <tr>
            <td class="label-cell">Date Retour</td>
            <td><input type="date" id="dateRetour" onchange="calculerAbsence()"></td>
            <td class="label-cell">Heure Retour</td>
            <td><input type="time" id="heureRetour" onchange="calculerAbsence()"></td>
        </tr>
        <tr>
            <td class="label-cell">Nombre Jours Abs</td>
            <td><input type="text" id="nbJours" readonly></td>
            <td class="label-cell">Nombre Heures Abs</td>
            <td><input type="text" id="nbHeures" readonly></td>
        </tr>
    </table>

    <table class="sig-table">
        <tr>
            <th>SIGNATURE :<br>DEMANDEUR</th>
            <th><br>RESPONSABLE</th>
            <th><br>DIRECTION</th>
        </tr>
        <tr>
            <td>
                <span class="text-signature" id="signatureText">Z. Badis</span>
            </td>
            <td></td>
            <td></td>
        </tr>
    </table>

    <div class="btn-container">
        <button class="btn-print" onclick="window.print()">Imprimer / Enregistrer PDF</button>
    </div>
</div>

<script>
    document.getElementById('dateDemande').valueAsDate = new Date();

    function updateSignature() {
        const nom = document.getElementById('nomInput').value.trim();
        const prenom = document.getElementById('prenomInput').value.trim();
        
        let signatureStr = '';
        if (prenom.length > 0) {
            signatureStr += prenom.charAt(0).toUpperCase() + '. ';
        }
        if (nom.length > 0) {
            signatureStr += nom.charAt(0).toUpperCase() + nom.slice(1).toLowerCase();
        }
        document.getElementById('signatureText').textContent = signatureStr;
    }

    // --- CONFIGURATION DES JOURS FÉRIÉS ---
    // 1. Les jours fériés fixes (Format "MM-JJ")
    const joursFeriesFixes = [
        "01-01", // Nouvel An
        "01-11", // Manifeste de l'Indépendance
        "05-01", // Fête du Travail
        "07-30", // Fête du Trône
        "08-14", // Allégeance Oued Ed-Dahab
        "08-20", // Révolution du Roi et du Peuple
        "08-21", // Fête de la Jeunesse
        "11-06", // Marche Verte
        "11-18"  // Fête de l'Indépendance
    ];

    // 2. Les jours fériés mobiles pour l'année en cours (Format "AAAA-MM-JJ")
    const joursFeriesMobiles = [
        "2026-09-25" // Aïd Al Mawlid (Secteur Privé - 1 seul jour)
    ];

    function calculerAbsence() {
        const dateDepart = document.getElementById('dateDepart').value;
        const dateRetour = document.getElementById('dateRetour').value;
        const heureDepart = document.getElementById('heureDepart').value;
        const heureRetour = document.getElementById('heureRetour').value;

        if (!dateDepart || !dateRetour || !heureDepart || !heureRetour) {
            document.getElementById('nbJours').value = '';
            document.getElementById('nbHeures').value = '';
            return;
        }

        let startDt = new Date(`${dateDepart}T${heureDepart}:00`);
        let endDt = new Date(`${dateRetour}T${heureRetour}:00`);
        
        if (startDt >= endDt) {
            document.getElementById('nbJours').value = '';
            document.getElementById('nbHeures').value = '';
            return;
        }

        let totalJours = 0;
        let totalHeures = 0;
        const heuresParJour = 8; 

        let currentDay = new Date(dateDepart);
        currentDay.setHours(0, 0, 0, 0);
        
        let endDay = new Date(dateRetour);
        endDay.setHours(0, 0, 0, 0);

        while (currentDay <= endDay) {
            let jourSemaine = currentDay.getDay(); 
            
            let mois = String(currentDay.getMonth() + 1).padStart(2, '0');
            let jour = String(currentDay.getDate()).padStart(2, '0');
            let annee = currentDay.getFullYear();
            let dateFixe = `${mois}-${jour}`;
            let dateMobile = `${annee}-${mois}-${jour}`;

            if (jourSemaine === 0 || joursFeriesFixes.includes(dateFixe) || joursFeriesMobiles.includes(dateMobile)) {
                currentDay.setDate(currentDay.getDate() + 1);
                continue; 
            }
            
            let intervals = [];
            let workHoursForDay = 8;

            if (jourSemaine >= 1 && jourSemaine <= 5) {
                intervals.push([8, 12]);   
                intervals.push([14, 18]);  
                workHoursForDay = 8;
            } else if (jourSemaine === 6) {
                intervals.push([9, 12]);   
                workHoursForDay = 3; 
            }

            let missedHours = 0;

            for (let i = 0; i < intervals.length; i++) {
                let intStart = new Date(currentDay);
                intStart.setHours(intervals[i][0], 0, 0, 0);
                
                let intEnd = new Date(currentDay);
                intEnd.setHours(intervals[i][1], 0, 0, 0);

                let calcStart = startDt > intStart ? startDt : intStart;
                let calcEnd = endDt < intEnd ? endDt : intEnd;

                if (calcStart < calcEnd) {
                    missedHours += (calcEnd - calcStart) / (1000 * 60 * 60);
                }
            }
            
            missedHours = Math.round(missedHours * 100) / 100;

            if (jourSemaine >= 1 && jourSemaine <= 5) {
                if (missedHours >= workHoursForDay) {
                    totalJours += 1; 
                } else {
                    totalHeures += missedHours; 
                }
            } else if (jourSemaine === 6) {
                totalHeures += missedHours; 
            }
            
            currentDay.setDate(currentDay.getDate() + 1);
        }

        if (totalHeures >= heuresParJour) {
            totalJours += Math.floor(totalHeures / heuresParJour);
            totalHeures = totalHeures % heuresParJour;
        }

        document.getElementById('nbJours').value = (totalJours > 0) ? totalJours : '';
        document.getElementById('nbHeures').value = (totalHeures > 0) ? totalHeures.toString().replace('.', ',') : '';
    }

    window.addEventListener('beforeprint', () => {
        document.querySelectorAll('input[type="date"], input[type="time"]').forEach(el => {
            el.setAttribute('data-type', el.type);
            el.setAttribute('data-val', el.value);
            
            if (el.type === 'date' && el.value) {
                const parts = el.value.split('-');
                if (parts.length === 3) {
                    el.type = 'text'; 
                    el.value = `${parts[2]}/${parts[1]}/${parts[0]}`; 
                }
            } else {
                el.type = 'text';
            }
        });
    });

    window.addEventListener('afterprint', () => {
        document.querySelectorAll('input[data-type]').forEach(el => {
            el.type = el.getAttribute('data-type');
            el.value = el.getAttribute('data-val'); 
        });
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erreur SW'));
        });
    }
</script>

</body>
</html>
