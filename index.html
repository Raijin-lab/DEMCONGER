<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Absence</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 10px;
        }

        /* Conteneur principal simulant la feuille A4 */
        .page-a4 {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Règle globale pour les tableaux (Mise en page identique au document papier) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        td, th {
            border: 1px solid #000;
            padding: 8px 12px;
            vertical-align: middle;
        }

        /* --- En-tête (A2CIM) --- */
        .header-table td {
            border: 2px solid #000;
            text-align: center;
        }
        .logo-cell {
            width: 35%;
        }
        .logo {
            font-size: 42px;
            font-weight: bold;
            margin: 0;
        }
        .logo .a2 { color: #555; }
        .logo .cim { color: #d32f2f; }
        .title-doc {
            font-size: 22px;
            font-weight: bold;
        }

        /* --- Date de la demande --- */
        .date-demande-container {
            text-align: right;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        .date-demande-container input {
            border: none;
            border-bottom: 1px dashed #000;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            width: 130px;
            text-align: center;
        }

        /* --- Corps du formulaire --- */
        .form-table td {
            height: 45px;
            font-size: 15px;
        }
        .label-cell {
            background-color: #f9f9f9;
            font-weight: bold;
            width: 25%;
        }

        /* Checkboxes */
        .checkbox-group {
            display: flex;
            justify-content: flex-start;
            gap: 25px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* Inputs généraux */
        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            background: transparent;
        }
        .uppercase-input {
            text-transform: uppercase;
        }

        /* --- Tableau des signatures --- */
        .sig-table th {
            background-color: #f9f9f9;
            text-align: left;
            font-size: 12px;
            vertical-align: top;
            height: 40px;
            width: 33.33%;
        }
        .sig-table td {
            height: 100px; /* Espace pour signer */
            text-align: center;
        }
        .text-signature {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 32px;
            color: #000044;
            transform: rotate(-5deg);
            display: inline-block;
        }

        /* --- Bouton --- */
        .btn-container {
            text-align: center;
            margin-top: 30px;
        }
        .btn-print {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }

        /* ========================================= */
        /* ADAPTATION SPÉCIFIQUE IMPRESSION / PDF    */
        /* ========================================= */
        @media print {
            body { background: none; padding: 0; }
            .page-a4 { box-shadow: none; padding: 0; max-width: 100%; width: 100%; margin: 0; }
            .btn-container { display: none; }
            /* Force les couleurs d'origine */
            .logo .a2 { color: #555 !important; -webkit-print-color-adjust: exact; }
            .logo .cim { color: #d32f2f !important; -webkit-print-color-adjust: exact; }
            .label-cell, .sig-table th { background-color: #f9f9f9 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="page-a4">
    
    <!-- En-tête -->
    <table class="header-table">
        <tr>
            <td class="logo-cell">
                <div class="logo"><span class="a2">A2</span><span class="cim">CIM</span></div>
            </td>
            <td class="title-doc">DEMANDE D'AUTORISATION D'ABSENCE</td>
        </tr>
    </table>

    <!-- Date de demande -->
    <div class="date-demande-container">
        Date de la demande : <input type="date" id="dateDemande">
    </div>

    <!-- Formulaire principal -->
    <table class="form-table">
        <tr>
            <td class="label-cell">Type d'absence :</td>
            <td colspan="3">
                <div class="checkbox-group">
                    <label><input type="radio" name="type" value="conge_paye"> Congé Payé</label>
                    <label><input type="radio" name="type" value="conge_sans_solde"> Congé sans solde</label>
                    <label><input type="radio" name="type" value="recuperation"> Récupération</label>
                </div>
            </td>
        </tr>
        <tr>
            <td class="label-cell">NOM</td>
            <td colspan="3"><input type="text" value="BADIS" class="uppercase-input"></td>
        </tr>
        <tr>
            <td class="label-cell">PRENOM</td>
            <td colspan="3"><input type="text" value="ZOUHAIR" class="uppercase-input"></td>
        </tr>
        <tr>
            <td class="label-cell">Date Départ</td>
            <td style="width: 25%;"><input type="date" id="dateDepart" onchange="calculerAbsence()"></td>
            <td class="label-cell" style="width: 25%;">Heure Départ</td>
            <td style="width: 25%;"><input type="time" id="heureDepart" onchange="calculerAbsence()"></td>
        </tr>
        <tr>
            <td class="label-cell">Date Retour</td>
            <td><input type="date" id="dateRetour" onchange="calculerAbsence()"></td>
            <td class="label-cell">Heure Retour</td>
            <td><input type="time" id="heureRetour" onchange="calculerAbsence()"></td>
        </tr>
        <tr>
            <td class="label-cell">Nombre Jours Abs</td>
            <!-- J'utilise type="text" au lieu de number pour retirer nativement les flèches haut/bas du navigateur -->
            <td><input type="text" id="nbJours" readonly></td>
            <td class="label-cell">Nombre Heures Abs</td>
            <td><input type="text" id="nbHeures" readonly></td>
        </tr>
    </table>

    <!-- Signatures -->
    <table class="sig-table">
        <tr>
            <th>SIGNATURE :<br>DEMANDEUR</th>
            <th><br>RESPONSABLE</th>
            <th><br>DIRECTION</th>
        </tr>
        <tr>
            <td>
                <span class="text-signature">Z. Badis</span>
            </td>
            <td></td>
            <td></td>
        </tr>
    </table>

    <div class="btn-container">
        <button class="btn-print" onclick="window.print()">Imprimer / Enregistrer PDF</button>
    </div>
</div>

<script>
    // Initialisation de la date de la demande
    document.getElementById('dateDemande').valueAsDate = new Date();

    // Calcul automatique des heures et jours
    function calculerAbsence() {
        const dateDepart = document.getElementById('dateDepart').value;
        const dateRetour = document.getElementById('dateRetour').value;
        const heureDepart = document.getElementById('heureDepart').value;
        const heureRetour = document.getElementById('heureRetour').value;

        if (!dateDepart || !dateRetour) return;

        let d1 = new Date(dateDepart);
        let d2 = new Date(dateRetour);
        
        if (d1 > d2) return;

        let totalJours = 0;
        let totalHeures = 0;
        const heuresJourneeNormale = 8;
        const heuresSamedi = 3;

        let current = new Date(d1);
        while (current <= d2) {
            let jourSemaine = current.getDay();

            if (jourSemaine === 0) {
                // Dimanche = 0
            } else if (jourSemaine === 6) {
                totalHeures += heuresSamedi;
                totalJours += (heuresSamedi / heuresJourneeNormale); 
            } else {
                totalHeures += heuresJourneeNormale;
                totalJours += 1;
            }
            current.setDate(current.getDate() + 1);
        }

        if (dateDepart === dateRetour && heureDepart && heureRetour) {
            let hD = parseFloat(heureDepart.split(':')[0]) + (parseFloat(heureDepart.split(':')[1]) / 60);
            let hR = parseFloat(heureRetour.split(':')[0]) + (parseFloat(heureRetour.split(':')[1]) / 60);
            let jourSemaine = d1.getDay();
            
            if (jourSemaine === 0) {
                totalHeures = 0;
                totalJours = 0;
            } else if (jourSemaine === 6) {
                let start = Math.max(hD, 9);
                let end = Math.min(hR, 12);
                totalHeures = Math.max(0, end - start);
                totalJours = totalHeures / heuresJourneeNormale;
            } else {
                let mStart = Math.max(hD, 8);
                let mEnd = Math.min(hR, 12);
                let matinHeures = Math.max(0, mEnd - mStart);
                
                let aStart = Math.max(hD, 14);
                let aEnd = Math.min(hR, 18);
                let amHeures = Math.max(0, aEnd - aStart);
                
                totalHeures = matinHeures + amHeures;
                totalJours = totalHeures / heuresJourneeNormale;
            }
        }

        // Affiche le résultat en remplaçant le point par une virgule pour un style plus propre
        document.getElementById('nbJours').value = totalJours.toFixed(2).replace('.', ',');
        document.getElementById('nbHeures').value = totalHeures.toFixed(2).replace('.', ',');
    }

    // =========================================================================
    // L'ASTUCE ANTI-TRIANGLES : Transformation des champs avant l'impression
    // =========================================================================
    window.addEventListener('beforeprint', () => {
        document.querySelectorAll('input[type="date"], input[type="time"]').forEach(el => {
            el.setAttribute('data-type', el.type);     // On sauvegarde le type original
            el.setAttribute('data-val', el.value);     // On sauvegarde la valeur originale
            
            if (el.type === 'date' && el.value) {
                // Formate la date au format FR (JJ/MM/AAAA) pour le PDF
                const parts = el.value.split('-');
                if (parts.length === 3) {
                    el.type = 'text'; 
                    el.value = `${parts[2]}/${parts[1]}/${parts[0]}`; 
                }
            } else {
                // Change juste le type pour faire disparaître l'horloge
                el.type = 'text';
            }
        });
    });

    // On restaure les champs dans leur état normal après la génération du PDF
    window.addEventListener('afterprint', () => {
        document.querySelectorAll('input[data-type]').forEach(el => {
            el.type = el.getAttribute('data-type');
            el.value = el.getAttribute('data-val'); 
        });
    });

    // Enregistrement PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .catch(error => console.log('Erreur SW:', error));
        });
    }
</script>

</body>
</html>
