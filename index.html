<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Absence</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --border-color: #333;
        }
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* En-tête */
        .header {
            display: flex;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
        }
        .logo {
            flex: 1;
            font-size: 32px;
            font-weight: bold;
            padding: 15px;
            border-right: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo .a2 { color: #555; }
        .logo .cim { color: #d32f2f; }
        .title {
            flex: 2;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Date de demande */
        .date-demande {
            text-align: right;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .date-demande input {
            border: none;
            border-bottom: 1px dashed #000;
            font-size: 16px;
            font-family: inherit;
            max-width: 150px;
        }

        /* Lignes du formulaire */
        .row {
            display: flex;
            border: 1px solid var(--border-color);
            border-bottom: none;
        }
        .row:last-of-type {
            border-bottom: 1px solid var(--border-color);
        }
        .label {
            background-color: #f9f9f9;
            padding: 10px;
            font-weight: bold;
            border-right: 1px solid var(--border-color);
            width: 150px;
            display: flex;
            align-items: center;
        }
        .content {
            padding: 10px;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .uppercase-input {
            text-transform: uppercase;
        }

        /* Checkboxes */
        .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        /* Inputs text/date */
        input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
            border: 1px solid #ccc;
            padding: 8px;
            font-size: 14px;
            width: 100%;
        }
        
        /* Grille pour les dates et heures */
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
        }
        .grid-cell {
            display: flex;
            border-right: 1px solid var(--border-color);
        }
        .grid-cell:last-child {
            border-right: none;
        }
        .grid-cell .label {
            width: 120px;
            border-right: 1px solid var(--border-color);
            border-bottom: none;
        }
        
        /* Signatures */
        .signatures {
            display: flex;
            margin-top: 30px;
            border: 1px solid var(--border-color);
        }
        .sig-box {
            flex: 1;
            min-height: 120px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }
        .sig-box:last-child {
            border-right: none;
        }
        .sig-title {
            font-weight: bold;
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
            background-color: #f9f9f9;
        }
        .sig-title span {
            display: block;
            font-size: 12px;
        }
        .signature-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }
        .text-signature {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 32px;
            color: #000044;
            transform: rotate(-5deg);
            user-select: none;
        }

        /* Bouton d'action */
        .actions {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }

        /* ADAPTATION POUR LES TÉLÉPHONES */
        @media screen and (max-width: 768px) {
            .header {
                flex-direction: column;
            }
            .logo, .title {
                border-right: none;
            }
            .logo {
                border-bottom: 2px solid var(--border-color);
            }
            .row {
                flex-direction: column;
            }
            .label {
                width: 100%;
                border-right: none;
                border-bottom: 1px dashed #ccc;
                padding: 8px 10px;
            }
            .grid-2x2 {
                grid-template-columns: 1fr;
            }
            .grid-cell {
                flex-direction: column;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .grid-cell:last-child {
                border-bottom: none;
            }
            .grid-cell .label {
                width: 100%;
                border-right: none;
            }
            .signatures {
                flex-direction: column;
            }
            .sig-box {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                min-height: 100px;
            }
            .sig-box:last-child {
                border-bottom: none;
            }
        }

        /* ADAPTATION POUR L'IMPRESSION ET LE PDF (Nettoyage des flèches/triangles) */
        @media print {
            body { background: none; padding: 0; }
            .container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .actions { display: none; }
            input { border: none !important; background: transparent; padding: 0; }
            
            /* Masquer les icônes de calendrier et d'heure sur le PDF généré */
            input[type="date"]::-webkit-calendar-picker-indicator,
            input[type="time"]::-webkit-calendar-picker-indicator {
                display: none !important;
            }
            
            /* Forcer la mise en page d'origine horizontalement */
            .header { flex-direction: row; }
            .logo { border-right: 2px solid var(--border-color); border-bottom: none; }
            .row { flex-direction: row; }
            .label { width: 150px; border-right: 1px solid var(--border-color); border-bottom: none; }
            .grid-2x2 { grid-template-columns: 1fr 1fr; }
            .grid-cell { flex-direction: row; border-right: 1px solid var(--border-color); border-bottom: none; }
            .grid-cell:last-child { border-right: none; }
            .grid-cell .label { width: 120px; border-right: 1px solid var(--border-color); }
            .signatures { flex-direction: row; }
            .sig-box { border-right: 1px solid var(--border-color); border-bottom: none; }
            .sig-box:last-child { border-right: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo"><span class="a2">A2</span><span class="cim">CIM</span></div>
        <div class="title">DEMANDE D'AUTORISATION D'ABSENCE</div>
    </div>

    <div class="date-demande">
        Date de la demande : <input type="date" id="dateDemande">
    </div>

    <div class="row">
        <div class="label">Type d'absence :</div>
        <div class="content checkbox-group">
            <label><input type="radio" name="type" value="conge_paye"> Congé Payé</label>
            <label><input type="radio" name="type" value="conge_sans_solde"> Congé sans solde</label>
            <label><input type="radio" name="type" value="recuperation"> Récupération</label>
        </div>
    </div>

    <div class="row">
        <div class="label">NOM</div>
        <div class="content"><input type="text" value="BADIS" class="uppercase-input"></div>
    </div>
    <div class="row">
        <div class="label">PRENOM</div>
        <div class="content"><input type="text" value="ZOUHAIR" class="uppercase-input"></div>
    </div>

    <div class="row" style="padding: 0;">
        <div class="grid-2x2">
            <div class="grid-cell">
                <div class="label">Date Départ</div>
                <div class="content"><input type="date" id="dateDepart" onchange="calculerAbsence()"></div>
            </div>
            <div class="grid-cell">
                <div class="label">Heure Départ</div>
                <div class="content"><input type="time" id="heureDepart" onchange="calculerAbsence()"></div>
            </div>
        </div>
    </div>

    <div class="row" style="padding: 0;">
        <div class="grid-2x2">
            <div class="grid-cell">
                <div class="label">Date Retour</div>
                <div class="content"><input type="date" id="dateRetour" onchange="calculerAbsence()"></div>
            </div>
            <div class="grid-cell">
                <div class="label">Heure Retour</div>
                <div class="content"><input type="time" id="heureRetour" onchange="calculerAbsence()"></div>
            </div>
        </div>
    </div>

    <div class="row" style="padding: 0;">
        <div class="grid-2x2">
            <div class="grid-cell">
                <div class="label">Nombre Jours Abs</div>
                <div class="content"><input type="number" min="0" step="0.1" id="nbJours"></div>
            </div>
            <div class="grid-cell">
                <div class="label">Nombre Heures Abs</div>
                <div class="content"><input type="number" min="0" step="0.5" id="nbHeures"></div>
            </div>
        </div>
    </div>

    <div class="signatures">
        <div class="sig-box">
            <div class="sig-title">SIGNATURE : <span>DEMANDEUR</span></div>
            <div class="signature-content">
                <span class="text-signature">Z. Badis</span>
            </div>
        </div>
        <div class="sig-box">
            <div class="sig-title"><br><span>RESPONSABLE</span></div>
        </div>
        <div class="sig-box">
            <div class="sig-title"><br><span>DIRECTION</span></div>
        </div>
    </div>

    <div class="actions">
        <button onclick="window.print()">Imprimer / Sauvegarder en PDF</button>
    </div>
</div>

<script>
    document.getElementById('dateDemande').valueAsDate = new Date();

    function calculerAbsence() {
        const dateDepart = document.getElementById('dateDepart').value;
        const dateRetour = document.getElementById('dateRetour').value;
        const heureDepart = document.getElementById('heureDepart').value;
        const heureRetour = document.getElementById('heureRetour').value;

        if (!dateDepart || !dateRetour) return;

        let d1 = new Date(dateDepart);
        let d2 = new Date(dateRetour);
        
        if (d1 > d2) return;

        let totalJours = 0;
        let totalHeures = 0;
        
        const heuresJourneeNormale = 8;
        const heuresSamedi = 3;

        let current = new Date(d1);
        while (current <= d2) {
            let jourSemaine = current.getDay();

            if (jourSemaine === 0) {
                // Dimanche = 0
            } else if (jourSemaine === 6) {
                totalHeures += heuresSamedi;
                totalJours += (heuresSamedi / heuresJourneeNormale); 
            } else {
                totalHeures += heuresJourneeNormale;
                totalJours += 1;
            }
            current.setDate(current.getDate() + 1);
        }

        if (dateDepart === dateRetour && heureDepart && heureRetour) {
            let hD = parseFloat(heureDepart.split(':')[0]) + (parseFloat(heureDepart.split(':')[1]) / 60);
            let hR = parseFloat(heureRetour.split(':')[0]) + (parseFloat(heureRetour.split(':')[1]) / 60);
            
            let jourSemaine = d1.getDay();
            
            if (jourSemaine === 0) {
                totalHeures = 0;
                totalJours = 0;
            } else if (jourSemaine === 6) {
                let start = Math.max(hD, 9);
                let end = Math.min(hR, 12);
                totalHeures = Math.max(0, end - start);
                totalJours = totalHeures / heuresJourneeNormale;
            } else {
                let mStart = Math.max(hD, 8);
                let mEnd = Math.min(hR, 12);
                let matinHeures = Math.max(0, mEnd - mStart);
                
                let aStart = Math.max(hD, 14);
                let aEnd = Math.min(hR, 18);
                let amHeures = Math.max(0, aEnd - aStart);
                
                totalHeures = matinHeures + amHeures;
                totalJours = totalHeures / heuresJourneeNormale;
            }
        }

        document.getElementById('nbJours').value = parseFloat(totalJours.toFixed(2));
        document.getElementById('nbHeures').value = parseFloat(totalHeures.toFixed(2));
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .catch(error => console.log('Erreur SW:', error));
        });
    }
</script>

</body>
</html>
